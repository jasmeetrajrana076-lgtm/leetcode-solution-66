name: Post LeetCode 66 Solution

on:
  schedule:
    - cron: '0 7 30 9 *'
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  post-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create LeetCode 66 solution
        run: |
          mkdir -p LeetCode
          cat > LeetCode/leet_code_66_solution.cpp << 'EOF'
          #include <vector>
          using namespace std;

          class Solution {
          public:
              vector<int> plusOne(vector<int>& digits) {
                  for(int i = digits.size() - 1; i >= 0; i--) {
                      if(digits[i] < 9) {
                          digits[i] += 1;
                          return digits;
                      }
                      else {
                          digits[i] = 0;
                      }
                  }

                  vector<int> ans;
                  ans.push_back(1);

                  for(int i = 0; i < digits.size(); i++) {
                      ans.push_back(digits[i]);
                  }

                  return ans;
              }
          };
          EOF

      - name: Remove scheduler
        run: |
          rm .github/workflows/main.yml

      - name: Commit LeetCode 66 solution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add LeetCode 66 Plus One solution"
          git push
